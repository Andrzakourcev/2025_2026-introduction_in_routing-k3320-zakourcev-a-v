name: lab4-part2
mgmt:
  network: my_mgmt-part2
  ipv4-subnet: 172.20.20.0/24

topology:
  kinds:
    vr-ros:
      image: vrnetlab/mikrotik_routeros:6.47.9

  nodes:
    R.SPB:
      kind: vr-ros
      mgmt-ipv4: 172.20.20.101
      startup-config: config/part2/r01-spb.rsc
    R.HKI:
      kind: vr-ros
      mgmt-ipv4: 172.20.20.102
      startup-config: config/part2/r01-hki.rsc
    R.SVL:
      kind: vr-ros
      mgmt-ipv4: 172.20.20.103
      startup-config: config/part2/r01-svl.rsc
    R.LND:
      kind: vr-ros
      mgmt-ipv4: 172.20.20.104
      startup-config: config/part2/r01-lnd.rsc
    R.LBN:
      kind: vr-ros
      mgmt-ipv4: 172.20.20.105
      startup-config: config/part2/r01-lbn.rsc
    R.NY:
      kind: vr-ros
      mgmt-ipv4: 172.20.20.106
      startup-config: config/part2/r01-ny.rsc
    PC1:
      kind: linux
      image: alpine:latest
      mgmt-ipv4: 172.20.20.2
      binds:
        - ./config:/config
      exec:
        - sh /config/part2/PC2.sh
    PC2:
      kind: linux
      image: alpine:latest
      mgmt-ipv4: 172.20.20.3
      binds:
        - ./config:/config
      exec:
        - sh /config/part2/PC2.sh
    PC3:
      kind: linux
      image: alpine:latest
      mgmt-ipv4: 172.20.20.4
      binds:
        - ./config:/config
      exec:
        - sh /config/part2/PC2.sh


  links:
    - endpoints: ["R.SPB:eth1","R.HKI:eth1"]
    - endpoints: ["R.NY:eth1","R.LND:eth1"]
    - endpoints: ["R.SVL:eth1","R.LBN:eth1"]
    - endpoints: ["R.HKI:eth2","R.LND:eth3"]
    - endpoints: ["R.HKI:eth3","R.LBN:eth2"]
    - endpoints: ["R.LND:eth2","R.LBN:eth3"]
    - endpoints: ["R.SPB:eth2","PC1:eth1"]
    - endpoints: ["R.NY:eth2","PC2:eth1"]
    - endpoints: ["R.SVL:eth2","PC3:eth1"]
    
    