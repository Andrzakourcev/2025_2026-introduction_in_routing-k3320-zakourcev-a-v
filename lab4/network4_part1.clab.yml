name: lab4-part1
mgmt:
  network: my_mgmt-part1
  ipv4-subnet: 172.20.16.0/24

topology:
  kinds:
    vr-ros:
      image: vrnetlab/mikrotik_routeros:6.47.9

  nodes:
    R.SPB:
      kind: vr-ros
      mgmt-ipv4: 172.20.16.101
      startup-config: config/part1/R_SPB.rsc
    R.HKI:
      kind: vr-ros
      mgmt-ipv4: 172.20.16.102
      startup-config: config/part1/R_HKI.rsc
    R.SVL:
      kind: vr-ros
      mgmt-ipv4: 172.20.16.103
      startup-config: config/part1/R_SVL.rsc
    R.LND:
      kind: vr-ros
      mgmt-ipv4: 172.20.16.104
      startup-config: config/part1/R_LND.rsc
    R.LBN:
      kind: vr-ros
      mgmt-ipv4: 172.20.16.105
      startup-config: config/part1/R_LBN.rsc
    R.NY:
      kind: vr-ros
      mgmt-ipv4: 172.20.16.106
      startup-config: config/part1/R_NY.rsc
    PC1:
      kind: linux
      image: alpine:latest
      mgmt-ipv4: 172.20.16.2
      binds:
        - ./config:/config
      exec:
        - sh /config/part1/PC1.sh
    PC2:
      kind: linux
      image: alpine:latest
      mgmt-ipv4: 172.20.16.3
      binds:
        - ./config:/config
      exec:
        - sh /config/part1/PC1.sh
    PC3:
      kind: linux
      image: alpine:latest
      mgmt-ipv4: 172.20.16.4
      binds:
        - ./config:/config
      exec:
        - sh /config/part1/PC1.sh


  links:
    - endpoints: ["R.SPB:eth1","R.HKI:eth1"]
    - endpoints: ["R.NY:eth1","R.LND:eth1"]
    - endpoints: ["R.SVL:eth1","R.LBN:eth1"]
    - endpoints: ["R.HKI:eth2","R.LND:eth3"]
    - endpoints: ["R.HKI:eth3","R.LBN:eth2"]
    - endpoints: ["R.LND:eth2","R.LBN:eth3"]
    - endpoints: ["R.SPB:eth2","PC1:eth1"]
    - endpoints: ["R.NY:eth2","PC2:eth1"]
    - endpoints: ["R.SVL:eth2","PC3:eth1"]
    
    